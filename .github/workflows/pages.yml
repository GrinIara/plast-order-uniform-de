name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Зміни лише в docs/ чи README сайт не перебудовують. Розклад і ручний запуск фільтру не мають.
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'config.example.json'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    - cron: '17 5 * * *' # щодня: оновити знімок каталогу й перебудувати
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          REQUIRE_CONFIG: '1'
          SITE_CONFIG: ${{ vars.SITE_CONFIG }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Сувора перевірка таблиці: деплой не блокує, але при помилках відкриває issue
  # (сповіщення отримують спостерігачі репозиторію). Також не дає розкладу вимкнутись.
  validate-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate catalog (strict)
        id: validate
        run: |
          npm run config
          npm run validate:catalog 2>&1 | tee validate.log
        env:
          REQUIRE_CONFIG: '1'
          SITE_CONFIG: ${{ vars.SITE_CONFIG }}
      - name: Open issue on invalid rows
        if: failure() && steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Таблиця каталогу: помилки перевірки ($(date +%F))" \
            --body "$(printf 'Щоденна перевірка таблиці каталогу знайшла помилки: некоректні рядки каталогу або дати вікна замовлень (order_open / order_close у листі settings). Деталі в журналі нижче.\n\n```\n%s\n```\n' "$(cat validate.log)")"
      - name: Keep scheduled workflow enabled
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/enable"
